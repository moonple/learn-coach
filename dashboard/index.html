<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>learn-coach 学习系统</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="256x256" href="assets/app.png">
<link rel="icon" type="image/png" sizes="48x48" href="assets/app-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/app-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/app-16.png">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">📗</span><span class="brand-txt">learn-coach</span></div>
    <nav class="nav" id="nav">
      <button data-tab="home" class="active"><span class="ico">🏠</span><span class="lbl">总览</span></button>
      <button data-tab="coach"><span class="ico">💬</span><span class="lbl">AI 教练</span></button>
      <button data-tab="graph"><span class="ico">🕸️</span><span class="lbl">知识图谱</span></button>
      <button data-tab="review"><span class="ico">🃏</span><span class="lbl">复习</span></button>
      <button data-tab="library"><span class="ico">📖</span><span class="lbl">资料</span></button>
      <button data-tab="settings"><span class="ico">⚙️</span><span class="lbl">设置</span></button>
    </nav>
    <div class="side-foot">
      <div>数据全部保存在本机</div>
      <div id="updated" class="muted"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="top-title" id="top-title">总览</div>
      <div class="top-actions">
        <select id="ws-select" title="切换学习主题"></select>
        <button id="refresh" class="btn icon-btn" title="重新读取工作区数据（教练窗口写入后点这里同步）">⟳</button>
        <button id="new-topic" class="btn primary">＋ 新主题</button>
      </div>
    </header>
    <main id="view"><div class="empty">正在读取工作区数据…</div></main>
  </div>
</div>
<div id="modal-root"></div>
<script src="app.js"></script>
</body>
</html>
