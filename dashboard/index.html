<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>learn-coach 学习系统</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="256x256" href="assets/app.png">
<link rel="icon" type="image/png" sizes="48x48" href="assets/app-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/app-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/app-16.png">
<meta name="theme-color" content="#f3eee2">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">📚</span> learn-coach 学习系统</div>
  <div class="controls">
    <select id="ws-select" title="切换学习工作区"></select>
    <button id="del-topic" title="删除当前主题（连同全部学习数据与上传资料，不可恢复）">🗑</button>
    <button id="new-topic" title="新建学习主题（网页立项）">＋ 新主题</button>
    <button id="refresh" title="重新读取工作区数据（不重载界面）">刷新数据</button>
    <button id="reload-page" title="重新加载整个界面（应用更新后点这里生效）">⟳ 刷新页面</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="overview" class="active">🏠 总览</button>
  <button data-tab="modules">📚 学习进度</button>
  <button data-tab="graph">🗺️ 知识图谱</button>
  <button data-tab="cards">🃏 卡片复习</button>
  <button data-tab="mistakes">📝 错题本</button>
  <button data-tab="weekly">📋 学习周报</button>
  <button data-tab="coach">🤖 AI教练</button>
  <button data-tab="settings">⚙️ 设置</button>
</nav>

<main id="view"><div class="empty">正在读取工作区数据…</div></main>

<footer class="foot">
  数据保存在本机 · 评分以答题记录为准
  · <span id="updated"></span>
</footer>

<script src="app.js"></script>
</body>
</html>
